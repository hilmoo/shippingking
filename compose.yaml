services:
  shippingking:
    image: ghcr.io/hilmoo/shippingking:latest
    container_name: shippingking
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      RAJAONGKIR_API_KEY: ${RAJAONGKIR_API_KEY}
    healthcheck:
      test: ["CMD", "/server", "-healthcheck"]
      interval: 30s
      timeout: 5s
      start_period: 5s
      retries: 3
